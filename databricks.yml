bundle:
  name: revodata-assignment
  databricks_cli_version: ">= 0.230.0"

artifacts:
  platform:
    build: |
      python3 build.py

include:
  - bundle/resources/*.yml
  - bundle/resources/**/*.yml
  - bundle/resources/**/**/*.yml

variables:
  catalog:
    description: "Name of the catalog to use in Databricks"
    default: "revodata_assignment_catalog"
  schema:
    description: "Name of the schema to use in Databricks"
    default: "revodata_assignment_schema"
  environment:
    description: "Deployment environment"
    default: "t"
  bronze_adls_path: 
    description: "ADLS path for bronze layer"
    default: "abfss://con-bronze@sarevodata.dfs.core.windows.net/"
  jobs_run_as:
    description: "Object ID of service principal to run jobs as (leave blank to use caller)"
    default: "0dc52a6b-ba4a-4036-b5a9-966691106390"
  silver_adls_path:
    description: "ADLS path for silver layer"
    default: "abfss://con-silver@sarevodata.dfs.core.windows.net/"
  gold_adls_path:
    description: "ADLS path for gold layer"
    default: "abfss://con-gold@sarevodata.dfs.core.windows.net/"
  service_principal_name:
    description: "Service principal name for job run_as (leave blank to use caller)"
    default: "0dc52a6b-ba4a-4036-b5a9-966691106390"

presets:
  tags:
    type: dab-revodata-assignment

targets:
  develop:
    mode: production
    workspace:
      host: https://adb-7405615066465253.13.azuredatabricks.net/
      root_path: /.bundle/${bundle.name}
    permissions:
      - level: CAN_MANAGE
        user_name: yldeshpande@gmail.com
        service_principal_name: "0dc52a6b-ba4a-4036-b5a9-966691106390"
    presets:
      jobs_max_concurrent_runs: 2
    variables:
      environment: "t"
      bronze_adls_path: "abfss://con-bronze@sarevodata.dfs.core.windows.net/"
      silver_adls_path: "abfss://con-silver@sarevodata.dfs.core.windows.net/"
      gold_adls_path: "abfss://con-gold@sarevodata.dfs.core.windows.net/"            
    run_as:
      service_principal_name: "0dc52a6b-ba4a-4036-b5a9-966691106390"