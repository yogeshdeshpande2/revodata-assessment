resources:
  clusters:
    revo_cluster:
      cluster_name: "revo_cluster"
      spark_version: "17.3.x-scala2.13"
      # node_type_id must use a supported SKU; note the correct capitalization
      node_type_id: "Standard_DS3_v2"
      autotermination_minutes: 10
      # num_workers: 1
      autoscale:
        min_workers: 1
        max_workers: 1
      policy_id: "001D3B0C8FBDAF19" # Personal Compute
      data_security_mode: "SINGLE_USER"
      # single_user_name: "0dc52a6b-ba4a-4036-b5a9-966691106390"

