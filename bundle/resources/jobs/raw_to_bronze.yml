resources:
  jobs:
    raw_to_bronze_job:
      name: "1_raw_to_bronze_job"
      tasks:
        - task_key: raw_to_bronze_task
          description: "Task to run the raw_to_bronze notebook"
          notebook_task:
            notebook_path: "${workspace.file_path}/bundle/notebooks/raw_to_bronze"
            base_parameters:
              environment: "${var.environment}"
              bundle_root_path: "${workspace.file_path}/bundle"
          existing_cluster_id: ${databricks_cluster.revo_cluster.id}
          timeout_seconds: 1800