resources:
  jobs:
    silver_to_gold_job:
      name: "3_silver_to_gold_job"
      tasks:
        - task_key: silver_to_gold_task
          description: "Task to run the silver_to_gold notebook"
          notebook_task:
            notebook_path: "${workspace.file_path}/bundle/notebooks/silver_to_gold"
            base_parameters:
              environment: "${var.environment}"
              bundle_root_path: "${workspace.file_path}/bundle"
          existing_cluster_id: ${databricks_cluster.revo_cluster.id}
          timeout_seconds: 1800                    